<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Your Free Consultation | Profit Process Consultant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f9e9;
            color: #333;
        }

        .header {
            background: #f6a623;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            color: white;
            font-size: 30px;
        }

        .header p {
            margin: 8px 0 0;
            color: white;
        }

        .container {
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        h2 {
            text-align: center;
            color: #e67e22;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            margin-bottom: 25px;
            color: #555;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: -8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #f6a623;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background: #cf711c;
        }

        .home-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            background: #9acd32;
            color: white;
            text-decoration: none;
            border-radius: 7px;
            font-weight: bold;
        }

        .home-btn:hover {
            background: #7fae28;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px 15px;
                padding: 22px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Profit Process Consultant</h1>
        <p>Finance • MIS • Power BI • Process Improvement</p>
    </div>

    <div class="container">

        <h2>Book Your Free Consultation</h2>

        <p class="intro">
            Tell us about your business or requirement.
            We will get back to you shortly.
        </p>

        <form action="https://formspree.io/f/xvkopgaa" method="POST">

            <label for="name">Your Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="whatsapp">WhatsApp Number</label>
            <input
                type="tel"
                id="whatsapp"
                name="whatsapp"
                placeholder="Enter your WhatsApp number"
                required
            >

            <label for="company">Company Name</label>
            <input
                type="text"
                id="company"
                name="company"
                placeholder="Enter your company name"
            >

            <label for="service">Service Required</label>

            <select id="service" name="service" required>
                <option value="">Select a service</option>
                <option value="Excel / MIS Dashboard">
                    Excel / MIS Dashboard
                </option>

                <option value="Power BI Dashboard">
                    Power BI Dashboard
                </option>

                <option value="Finance & Accounts Support">
                    Finance & Accounts Support
                </option>

                <option value="Process Improvement">
                    Process Improvement
                </option>

                <option value="Other">
                    Other
                </option>
            </select>

            <label for="message">Tell Us About Your Requirement</label>

            <textarea
                id="message"
                name="message"
                placeholder="Please tell us about your business, requirement, or the support you need."
                required
            ></textarea>

            <button type="submit" class="btn">
                Send Message
            </button>

        </form>

        <a href="index.html" class="home-btn">
            ← Back to Home
        </a>

    </div>

    <div class="footer">
        © 2026 Profit Process Consultant. All Rights Reserved.
    </div>

</body>
</html>
